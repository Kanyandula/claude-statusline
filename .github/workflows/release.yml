name: Release

# Publishes to npm with build provenance when a v* tag is pushed.
# Cut a release:  npm version patch && git push --follow-tags
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for npm provenance + OIDC trusted publishing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Verify tag matches package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag != package.json $pkg"; exit 1
          fi

      # Trusted Publishing (OIDC) registry auth needs npm >= 11.5.1;
      # Node 22 ships npm 10.x, so upgrade before publishing.
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Test
        run: npm test

      # Auth via OIDC Trusted Publishing — no token. Configure on npmjs.com:
      # package Settings -> Trusted Publisher -> Kanyandula/claude-statusline, release.yml
      #
      # ponytail: 2.0.0 soaks on @next. Flip to --tag latest (or drop the flag)
      # before cutting a stable release; promote this build with no republish via
      #   npm dist-tag add @kanyandula/claude-statusline@2.0.0 latest
      - name: Publish
        run: npm publish --provenance --access public --tag next
