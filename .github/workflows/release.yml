name: Release

# Publishes to npm with build provenance when a v* tag is pushed.
# Cut a release:  npm version patch && git push --follow-tags
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for npm provenance + OIDC trusted publishing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Verify tag matches package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag != package.json $pkg"; exit 1
          fi

      - name: Test
        run: npm test

      # Auth via OIDC Trusted Publishing — no token. Configure on npmjs.com:
      # package Settings -> Trusted Publisher -> Kanyandula/claude-statusline, release.yml
      - name: Publish
        run: npm publish --provenance --access public
